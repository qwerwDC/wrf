<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Тревога — карандашная игра на выживание</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&family=Neucha&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:#1d1b18;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
  canvas{display:block;background:#f3eddc;box-shadow:0 10px 50px rgba(0,0,0,.6)}
  #snd{position:fixed;top:10px;right:10px;font:16px Neucha,cursive;background:#f3eddc;color:#222;border:2px solid #333;border-radius:8px;padding:4px 10px;cursor:pointer;opacity:.75;z-index:5}
  #touch{position:fixed;inset:0;pointer-events:none;display:none;z-index:4}
  .tb{position:absolute;bottom:16px;width:74px;height:74px;border:3px solid #2b2b2b;border-radius:50%;background:rgba(243,237,220,.55);font:30px Neucha,cursive;color:#2b2b2b;display:flex;align-items:center;justify-content:center;pointer-events:auto;touch-action:none}
  .tb.on{background:rgba(192,57,43,.4)}
  #bl{left:16px}#br{left:102px}#bd{right:104px}#bj{right:16px;bottom:74px}
</style>
</head>
<body>
<div id="wrap"><canvas id="game"></canvas></div>
<button id="snd">звук: вкл</button>
<div id="touch">
  <div class="tb" id="bl">◀</div><div class="tb" id="br">▶</div>
  <div class="tb" id="bd">▼</div><div class="tb" id="bj">▲</div>
</div>
<script>
'use strict';
/* =========================================================
   ТРЕВОГА — карандашная игра на выживание
   Логика 60 Гц, отрисовка 12 кадров/сек (эффект «живой» карандашной линии)
   ========================================================= */
const W=960,H=540,GROUND=455,DOORX=5000,EVACX=4985;
const cv=document.getElementById('game'),ctx=cv.getContext('2d');
const R=Math.random,clamp=(v,a,b)=>v<a?a:v>b?b:v,pick=a=>a[Math.floor(R()*a.length)],lerp=(a,b,t)=>a+(b-a)*t;
let SC=1,papers=[],pi=0;

/* ---------- бумага ---------- */
function makePaper(){
  papers=[];
  for(let n=0;n<2;n++){
    const c=document.createElement('canvas');c.width=cv.width;c.height=cv.height;
    const g=c.getContext('2d');
    g.fillStyle='#f2ecda';g.fillRect(0,0,c.width,c.height);
    const id=g.getImageData(0,0,c.width,c.height),d=id.data;
    for(let i=0;i<d.length;i+=4){const v=(R()-.5)*18;d[i]+=v;d[i+1]+=v;d[i+2]+=v*1.1;}
    g.putImageData(id,0,0);
    g.globalAlpha=.07;g.strokeStyle='#7a6f5a';g.lineWidth=.7;
    for(let i=0;i<280;i++){const x=R()*c.width,y=R()*c.height,a=R()*6.28,l=(4+R()*14)*SC;g.beginPath();g.moveTo(x,y);g.lineTo(x+Math.cos(a)*l,y+Math.sin(a)*l);g.stroke();}
    g.globalAlpha=1;
    const gr=g.createRadialGradient(c.width/2,c.height/2,c.height*.35,c.width/2,c.height/2,c.height*.95);
    gr.addColorStop(0,'rgba(0,0,0,0)');gr.addColorStop(1,'rgba(90,70,40,.24)');
    g.fillStyle=gr;g.fillRect(0,0,c.width,c.height);
    papers.push(c);
  }
}
function resize(){
  const s=Math.min(innerWidth/W,innerHeight/H);
  cv.style.width=Math.floor(W*s)+'px';cv.style.height=Math.floor(H*s)+'px';
  SC=clamp(s*(window.devicePixelRatio||1),1,2);
  cv.width=Math.round(W*SC);cv.height=Math.round(H*SC);
  makePaper();
}
let rzT;addEventListener('resize',()=>{clearTimeout(rzT);rzT=setTimeout(resize,150);});
resize();

/* ---------- карандаш ---------- */
const JIT=1.5;
const j=(a=JIT)=>(R()-.5)*2*a;
function pen(c='#262626',w=1.6,a=.9){ctx.strokeStyle=c;ctx.lineWidth=w;ctx.globalAlpha=a;ctx.lineCap='round';ctx.lineJoin='round';}
function line(x1,y1,x2,y2,n=2){
  const bw=ctx.lineWidth,dx=x2-x1,dy=y2-y1,L=Math.hypot(dx,dy)||1,ux=dx/L,uy=dy/L,bend=Math.min(3,L*.02);
  for(let i=0;i<n;i++){
    ctx.lineWidth=bw*(.65+R()*.6);
    const o1=j(2.5),o2=j(2.5);
    ctx.beginPath();
    ctx.moveTo(x1+j()-ux*o1,y1+j()-uy*o1);
    ctx.quadraticCurveTo((x1+x2)/2+j(bend+JIT),(y1+y2)/2+j(bend+JIT),x2+j()+ux*o2,y2+j()+uy*o2);
    ctx.stroke();
  }
  ctx.lineWidth=bw;
}
function rect(x,y,w,h,n=2){line(x,y,x+w,y,n);line(x+w,y,x+w,y+h,n);line(x+w,y+h,x,y+h,n);line(x,y+h,x,y,n);}
function poly(pts,closed=true,n=2){for(let i=0;i<pts.length-1;i++)line(pts[i][0],pts[i][1],pts[i+1][0],pts[i+1][1],n);if(closed){const l=pts[pts.length-1];line(l[0],l[1],pts[0][0],pts[0][1],n);}}
function circ(cx,cy,r,n=2){
  for(let k=0;k<n;k++){
    ctx.beginPath();const st=R()*6.28,ext=.25+R()*.45,seg=14;
    for(let i=0;i<=seg;i++){const a=st+(Math.PI*2+ext)*i/seg,rr=r+j(JIT*.7),x=cx+Math.cos(a)*rr,y=cy+Math.sin(a)*rr;i?ctx.lineTo(x,y):ctx.moveTo(x,y);}
    ctx.stroke();
  }
}
function ell(cx,cy,rx,ry,n=1){
  for(let k=0;k<n;k++){ctx.beginPath();const st=R()*6.28;for(let i=0;i<=17;i++){const a=st+i/16*6.283,x=cx+Math.cos(a)*(rx+j(.9)),y=cy+Math.sin(a)*(ry+j(.7));i?ctx.lineTo(x,y):ctx.moveTo(x,y);}ctx.stroke();}
}
function hatch(x,y,w,h,gap=6,dir=1,col='#333',lw=1,a=.4){
  if(w<=0||h<=0)return;
  ctx.save();ctx.beginPath();ctx.rect(x,y,w,h);ctx.clip();
  pen(col,lw,a);ctx.beginPath();
  for(let t=-h;t<w;t+=gap){const o=j(1.2);
    if(dir>0){ctx.moveTo(x+t+o,y+h+2);ctx.lineTo(x+t+h+o+j(1),y-2);}
    else{ctx.moveTo(x+t+o,y-2);ctx.lineTo(x+t+h+o+j(1),y+h+2);}}
  ctx.stroke();ctx.restore();
}
function fontStr(size,font){return font==='Caveat'?`700 ${size}px Caveat, cursive`:`${size}px Neucha, cursive`;}
function txt(s,x,y,size=24,col='#222',a=1,font,align='center'){
  ctx.save();ctx.globalAlpha=a;ctx.fillStyle=col;ctx.font=fontStr(size,font);ctx.textAlign=align;ctx.textBaseline='middle';
  ctx.translate(x+j(.7),y+j(.7));ctx.rotate(j(.01));ctx.fillText(s,0,0);ctx.restore();
}
function wrap(s,maxW,size,font){
  ctx.save();ctx.font=fontStr(size,font);
  const words=s.split(' '),out=[];let cur='';
  for(const w of words){const t=cur?cur+' '+w:w;if(ctx.measureText(t).width>maxW&&cur){out.push(cur);cur=w;}else cur=t;}
  if(cur)out.push(cur);ctx.restore();return out;
}
function bubble(x,y,text,col='#222'){
  ctx.save();ctx.font=fontStr(16);const w=ctx.measureText(text).width+16;ctx.restore();
  const h=24,bx=x-w/2,by=y-h;
  ctx.globalAlpha=.92;ctx.fillStyle='#fbf8ef';ctx.fillRect(bx,by,w,h);
  pen('#333',1.3,.9);rect(bx,by,w,h,1);line(x-4,by+h,x-9,by+h+8,1);line(x-9,by+h+8,x+5,by+h,1);
  txt(text,x,by+h/2+1,16,col);
}
function heart(x,y,full){
  const path=()=>{ctx.beginPath();ctx.moveTo(x,y+10);ctx.bezierCurveTo(x-17,y-2,x-10,y-15,x,y-6);ctx.bezierCurveTo(x+10,y-15,x+17,y-2,x,y+10);ctx.closePath();};
  if(full){ctx.save();path();ctx.clip();hatch(x-17,y-15,34,27,3,1,'#c0392b',1.4,.85);ctx.restore();}
  ctx.save();pen(full?'#8e1f17':'#777',1.8,.9);
  for(let k=0;k<2;k++){ctx.save();ctx.translate(j(.8),j(.8));path();ctx.stroke();ctx.restore();}
  ctx.restore();
}

/* ---------- звук (всё синтезируется WebAudio) ---------- */
const A={C:null,loops:{}};
let muted=false;
function audioInit(){
  if(A.C){if(A.C.state==='suspended')A.C.resume();return;}
  const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
  const C=new AC();A.C=C;
  A.master=C.createGain();A.master.gain.value=muted?0:.9;A.master.connect(C.destination);
  A.bus=C.createBiquadFilter();A.bus.type='lowpass';A.bus.frequency.value=18000;A.bus.connect(A.master);
  const len=C.sampleRate*2,b=C.createBuffer(1,len,C.sampleRate),d=b.getChannelData(0);
  for(let i=0;i<len;i++)d[i]=R()*2-1;A.noise=b;
}
function tone(f1,f2,dur,type='square',vol=.08,dest,delay=0){
  const C=A.C;if(!C)return;const t=C.currentTime+delay;
  const o=C.createOscillator(),g=C.createGain();o.type=type;
  o.frequency.setValueAtTime(f1,t);o.frequency.exponentialRampToValueAtTime(Math.max(20,f2),t+dur);
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g);g.connect(dest||A.bus);o.start(t);o.stop(t+dur+.05);
}
function nz(dur,type,freq,vol,q=1,sweepTo,dest){
  const C=A.C;if(!C)return;const t=C.currentTime;
  const s=C.createBufferSource();s.buffer=A.noise;s.loop=true;
  const f=C.createBiquadFilter();f.type=type;f.frequency.setValueAtTime(freq,t);if(sweepTo)f.frequency.exponentialRampToValueAtTime(sweepTo,t+dur);f.Q.value=q;
  const g=C.createGain();g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  s.connect(f);f.connect(g);g.connect(dest||A.bus);s.start(t,R()*1.5);s.stop(t+dur+.05);
}
function loopStop(name,fade=.5){
  const L=A.loops[name];if(!L||!A.C)return;const t=A.C.currentTime;
  L.g.gain.cancelScheduledValues(t);L.g.gain.setValueAtTime(L.g.gain.value,t);L.g.gain.linearRampToValueAtTime(0,t+fade);
  L.nodes.forEach(n=>{try{n.stop(t+fade+.05);}catch(e){}});delete A.loops[name];
}
function stopLoops(f=.5){Object.keys(A.loops).forEach(k=>loopStop(k,f));}
function sirenStart(){
  const C=A.C;if(!C||A.loops.siren)return;const t=C.currentTime;
  const g=C.createGain();g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.06,t+2.5);g.connect(A.bus);
  const nodes=[];
  [[560,.13,260,2200,1],[470,.09,200,900,.55]].forEach(([base,rate,depth,cut,v])=>{
    const f=C.createBiquadFilter();f.type='lowpass';f.frequency.value=cut;
    const gv=C.createGain();gv.gain.value=v;f.connect(gv);gv.connect(g);
    const lfo=C.createOscillator();lfo.frequency.value=rate;const lg=C.createGain();lg.gain.value=depth;lfo.connect(lg);lfo.start(t);nodes.push(lfo);
    [0,4].forEach(dt=>{const o=C.createOscillator();o.type='sawtooth';o.frequency.value=base+dt;lg.connect(o.frequency);o.connect(f);o.start(t);nodes.push(o);});
  });
  A.loops.siren={g,nodes};
}
function noiseLoop(name,type,freq,q,vol,fadeIn){
  const C=A.C;if(!C||A.loops[name])return;const t=C.currentTime;
  const s=C.createBufferSource();s.buffer=A.noise;s.loop=true;
  const f=C.createBiquadFilter();f.type=type;f.frequency.value=freq;f.Q.value=q;
  const am=C.createGain();am.gain.value=.6;
  const g=C.createGain();g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+fadeIn);
  s.connect(f);f.connect(am);am.connect(g);g.connect(A.bus);s.start(t);
  A.loops[name]={g,nodes:[s],am,f};
}
const crowdStart=()=>noiseLoop('crowd','bandpass',850,.9,.09,3);
const windStart=()=>noiseLoop('wind','lowpass',380,.7,.13,3);
function muffle(on){if(A.C)A.bus.frequency.setTargetAtTime(on?380:18000,A.C.currentTime,.3);}
const sfxJump=()=>nz(.07,'bandpass',2600,.07,2);
const sfxBump=()=>nz(.12,'lowpass',500,.3);
const sfxHurt=()=>{tone(240,70,.3,'square',.07);nz(.18,'lowpass',900,.35);};
const sfxGlass=()=>{nz(.35,'highpass',3000,.18);tone(2300,1400,.08,'triangle',.04);tone(2900,1900,.06,'triangle',.035,null,.05);};
const sfxHonk=()=>{tone(392,392,.16,'square',.05);tone(330,330,.24,'square',.05,null,.2);};
const sfxWhoosh=()=>nz(.7,'bandpass',400,.3,1.5,2600);
const sfxPickup=()=>{tone(660,990,.12,'triangle',.08);tone(990,1320,.14,'triangle',.07,null,.1);};
const sfxBird=()=>{const f=2600+R()*900;tone(f,f*1.25,.07,'sine',.025);tone(f*1.1,f*1.35,.06,'sine',.02,null,.11);};
const sfxClick=()=>nz(.01,'highpass',3500,.35);
const sfxCrackle=()=>nz(.03,'highpass',1600,.08);
function sfxScream(){
  const C=A.C;if(!C)return;const t=C.currentTime,f0=320+R()*260;
  const o=C.createOscillator();o.type='sawtooth';o.frequency.setValueAtTime(f0,t);o.frequency.linearRampToValueAtTime(f0*1.25,t+.15);o.frequency.exponentialRampToValueAtTime(f0*.6,t+.7);
  const vib=C.createOscillator();vib.frequency.value=7;const vg=C.createGain();vg.gain.value=12;vib.connect(vg);vg.connect(o.frequency);
  const bp=C.createBiquadFilter();bp.type='bandpass';bp.frequency.value=1100;bp.Q.value=3;
  const g=C.createGain();g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.035,t+.05);g.gain.exponentialRampToValueAtTime(.0001,t+.75);
  o.connect(bp);bp.connect(g);g.connect(A.bus);o.start(t);vib.start(t);o.stop(t+.8);vib.stop(t+.8);
}
function sfxBoom(muffled){
  const C=A.C;if(!C)return;const t=C.currentTime;
  const s=C.createBufferSource();s.buffer=A.noise;s.loop=true;
  const f=C.createBiquadFilter();f.type='lowpass';f.frequency.setValueAtTime(muffled?300:1200,t);f.frequency.exponentialRampToValueAtTime(40,t+5);
  const g=C.createGain();g.gain.setValueAtTime(.9,t);g.gain.exponentialRampToValueAtTime(.001,t+6);
  s.connect(f);f.connect(g);g.connect(A.master);s.start(t);s.stop(t+6);
  tone(60,22,3.5,'sine',.7,A.master);
}
const sndBtn=document.getElementById('snd');
function toggleMute(){muted=!muted;if(A.master)A.master.gain.value=muted?0:.9;sndBtn.textContent=muted?'звук: выкл':'звук: вкл';}
sndBtn.addEventListener('pointerdown',e=>e.stopPropagation());
sndBtn.addEventListener('click',e=>{audioInit();toggleMute();sndBtn.blur();});

/* ---------- ввод ---------- */
const keys={},inp={any:false,confirm:false,jump:false,down:false,r:false},touch={l:false,r:false,j:false,d:false};
let paused=false;
function setPaused(v){paused=v;if(A.C){v?A.C.suspend():A.C.resume();}}
addEventListener('keydown',e=>{
  const c=e.code;
  if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Space'].includes(c))e.preventDefault();
  keys[c]=true;if(e.repeat)return;
  audioInit();inp.any=true;
  if(c==='Space'||c==='Enter')inp.confirm=true;
  if(c==='Space'||c==='ArrowUp'||c==='KeyW')inp.jump=true;
  if(c==='ArrowDown'||c==='KeyS'||c==='KeyE')inp.down=true;
  if(c==='KeyR')inp.r=true;
  if(c==='KeyM')toggleMute();
  if((c==='KeyP'||c==='Escape')&&(state==='play1'||state==='play2'))setPaused(!paused);
});
addEventListener('keyup',e=>{keys[e.code]=false;});
addEventListener('blur',()=>{for(const k in keys)keys[k]=false;if(state==='play1'||state==='play2')setPaused(true);});
cv.addEventListener('pointerdown',()=>{audioInit();inp.any=true;inp.confirm=true;if(paused)setPaused(false);});
const kL=()=>keys.ArrowLeft||keys.KeyA||touch.l,kR=()=>keys.ArrowRight||keys.KeyD||touch.r,
      kJ=()=>keys.Space||keys.ArrowUp||keys.KeyW||touch.j,kD=()=>keys.ArrowDown||keys.KeyS||touch.d;
function bindBtn(id,key){
  const el=document.getElementById(id);
  const on=e=>{e.preventDefault();touch[key]=true;el.classList.add('on');audioInit();inp.any=true;if(paused)setPaused(false);
    if(key==='j'){inp.jump=true;inp.confirm=true;}if(key==='d')inp.down=true;};
  const off=e=>{e.preventDefault();touch[key]=false;el.classList.remove('on');};
  el.addEventListener('pointerdown',on);el.addEventListener('pointerup',off);el.addEventListener('pointercancel',off);el.addEventListener('pointerleave',off);
}
bindBtn('bl','l');bindBtn('br','r');bindBtn('bj','j');bindBtn('bd','d');
if(window.matchMedia&&matchMedia('(pointer:coarse)').matches)document.getElementById('touch').style.display='block';

/* ---------- состояние мира ---------- */
let state='title',stage=1,T=0,worldW=5300;
let p=null,solids=[],fires=[],cars=[],fallers=[],runners=[],npcs=[],parts=[],sparts=[],pickups=[],craters=[],decor=[],bgB=[],clouds=[],trails=[],ash=[],shelterPeople=[];
let camX=0,shx=0,shy=0,shake=0,flash=0;
let alarm=false,calmT=0,timeLeft=50,lastSec=99,stageT=0,totalT=0,dmgTaken=0;
let blastT=0,waveHit=false,waveSnd=false;
let shelterT=0,impactT=-1,shFlags={},canExit=false;
let rad=0,radRate=0,gT=0;
let deadReason='',deadT=0,winT=0,chopT=0;
let carT=0,fallT=0,runT=0,screamCD=0;
let ticker={text:'',x:W,col:'#444'},msgs=[];

const SCREAMS=['А-А-А!','Бежим!','Мама!','Где укрытие?!','Это не учения!','Помогите!','Спасайтесь!','Детей берите!','Не толкайтесь!','Быстрее!'];
const DAZE=['Кхе-кхе...','Воды...','Где все?','Куда идти?','Не может быть...','Мама?','Ничего не слышу...'];

function msg(text,dur=3,col='#222',size=28){msgs.push({text,t:dur,col,size});}
function newPlayer(x){return{x,y:GROUND,vx:0,vy:0,kx:0,w:20,h:60,onGround:true,face:1,ph:0,crouch:false,inv:0,coyote:0,jb:0,hp:3,blown:false,rot:0,hidden:false};}
function newNpc(x,mode='walk'){return{x,vx:0,face:R()<.5?-1:1,dir:1,ph:R()*6,mode,speed:25+R()*30,s:.78+R()*.14,child:R()<.12,b:null,bs:0,bt:R()*3,turnT:R()*4,stop:false,armsUp:R()<.5};}
function resetWorld(){solids=[];fires=[];cars=[];fallers=[];runners=[];npcs=[];parts=[];sparts=[];pickups=[];craters=[];decor=[];trails=[];msgs=[];shake=0;flash=0;camX=0;blastT=0;setPaused(false);}
function addSolid(x,w,h,type,y){
  const s={x,y:y??GROUND-h,w,h,type};
  if(type==='rubble'){s.pts=[[0,0]];const n=6;for(let i=1;i<n;i++)s.pts.push([w*i/n+j(6),-h*(.55+R()*.4)]);s.pts.push([w,0]);s.pts[3][1]=-h;}
  solids.push(s);return s;
}
function makeSkyline(){
  const arr=[];let x=-50;
  while(x<worldW*.5+W+100){
    const w=80+R()*110,h=130+R()*200,cols=Math.max(1,Math.floor((w-16)/22)),rows=Math.max(1,Math.floor((h-24)/30)),wins=[],jag=[];
    for(let r=0;r<rows;r++)for(let c=0;c<cols;c++)wins.push(R()<.22?2:(R()<.15?0:1));
    for(let k=0;k<=6;k++)jag.push(R()*h*.45);
    arr.push({x,w,h,cols,rows,wins,jag,smoke:R()<.4,burnt:R()<.5});x+=w+5+R()*25;
  }
  return arr;
}
function makeClouds(){clouds=[];for(let i=0;i<7;i++)clouds.push({x:R()*1400,y:40+R()*90,s:.7+R()*.7});}

/* ---------- ЭТАП 1: тревога ---------- */
function startStage1(){
  resetWorld();stage=1;worldW=5300;state='play1';stageT=0;totalT=0;dmgTaken=0;alarm=false;calmT=0;timeLeft=50;lastSec=99;
  p=newPlayer(160);

/* ---------- игрок и физика ---------- */
function ov(b,s){return b.x+b.w/2>s.x&&b.x-b.w/2<s.x+s.w&&b.y>s.y&&b.y-b.h<s.y+s.h;}
function moveBody(b,dt){
  b.x+=b.vx*dt;
  for(const s of solids)if(ov(b,s)){
    if(b.vx>0)b.x=s.x-b.w/2-.01;else if(b.vx<0)b.x=s.x+s.w+b.w/2+.01;
    else{const l=b.x+b.w/2-s.x,r=s.x+s.w-(b.x-b.w/2);b.x+=l<r?-l-.01:r+.01;}
  }
  b.y+=b.vy*dt;b.onGround=false;
  if(b.y>=GROUND){b.y=GROUND;b.vy=0;b.onGround=true;}
  for(const s of solids)if(ov(b,s)){
    if(b.vy>=0){b.y=s.y;b.vy=0;b.onGround=true;}else{b.y=s.y+s.h+b.h+.01;b.vy=0;}
  }
  b.x=clamp(b.x,15,worldW-15);
}
function surfaceAt(x){let y=GROUND;for(const s of solids)if(x>s.x&&x<s.x+s.w&&s.y<y&&s.y+s.h>=GROUND-2)y=s.y;return y;}
function updatePlayer(dt){
  const dir=(kR()?1:0)-(kL()?1:0);
  const wantC=kD()&&p.onGround;
  if(wantC&&!p.crouch){p.crouch=true;p.h=36;}
  else if(!wantC&&p.crouch){p.h=60;if(solids.some(s=>ov(p,s)))p.h=36;else p.crouch=false;}
  const sp=p.crouch?110:230;
  p.vx=dir*sp+p.kx;
  p.kx*=Math.pow(.03,dt);if(Math.abs(p.kx)<6)p.kx=0;
  if(dir)p.face=dir;
  p.coyote=p.onGround?.1:p.coyote-dt;
  if(inp.jump)p.jb=.12;p.jb-=dt;
  if(p.jb>0&&p.coyote>0&&!p.crouch){p.vy=-585;p.jb=0;p.coyote=0;sfxJump();}
  if(!kJ()&&p.vy<-150)p.vy+=1600*dt*1.3;
  p.vy=Math.min(1200,p.vy+1600*dt);
  moveBody(p,dt);
  p.ph+=dt*(Math.abs(p.vx)>10?(p.crouch?8:14):0);
  if(p.inv>0)p.inv-=dt;
}
function hurt(n,reason,kx){
  if(p.inv>0||(state!=='play1'&&state!=='play2'))return;
  p.hp-=n;p.inv=1.5;p.kx=kx;p.vy=-320;shake=10;dmgTaken++;sfxHurt();
  for(let i=0;i<6;i++)part(parts,p.x,p.y-30,{type:'spark',vx:j(250),vy:-100-R()*200,g:900,life:.4,col:'#c0392b'});
  if(p.hp<=0){p.hp=0;die(reason);}
}
function die(reason){
  if(state==='dead')return;
  state='dead';deadReason=reason;deadT=0;stopLoops(1.2);muffle(false);tone(300,60,1.2,'sawtooth',.05);
}
function updCamera(dt){camX+=(clamp(p.x-W*.4,0,worldW-W)-camX)*Math.min(1,dt*6);}

/* ---------- частицы ---------- */
function part(arr,x,y,o){const q=Object.assign({x,y,vx:0,vy:0,g:0,life:1,type:'dust',col:'#555',size:3,rot:R()*6,vr:0},o);q.max=q.life;arr.push(q);}
function updParts(arr,dt){
  for(const q of arr){q.vy+=q.g*dt;q.x+=q.vx*dt;q.y+=q.vy*dt;q.rot+=q.vr*dt;q.life-=dt;}
  for(let i=arr.length-1;i>=0;i--)if(arr[i].life<=0)arr.splice(i,1);
}
function shatter(x,y,type){
  const col={pot:'#8a4a2a',glass:'#4a7aa8',brick:'#8a3a2a',chunk:'#555'}[type]||'#555';
  for(let i=0;i<9;i++)part(parts,x,y-4,{type:'shard',vx:j(220),vy:-150-R()*250,g:1100,life:.7+R()*.4,size:3+R()*4,col,vr:j(15)});

}

  fallT-=dt;if(fallT<=0){fallT=2+R()*2;if(p.x<4700)spawnFaller(['brick','chunk','chunk']);}
  if(A.loops.wind&&R()<.02)A.loops.wind.f.frequency.setTargetAtTime(250+R()*350,A.C.currentTime,.8);

}

/* ---------- главный апдейт ---------- */
function update(dt){
  T+=dt;
  if(shake>0)shake=Math.max(0,shake-dt*20);
  if(flash>0)flash=Math.max(0,flash-dt*(state==='blast'?.45:1.2));
  for(const m of msgs)m.t-=dt;msgs=msgs.filter(m=>m.t>0);
  ticker.x-=dt*85;
  switch(state){
    case 'title':if(inp.any){audioInit();startStage1();}break;
    case 'play1':updPlay1(dt);break;
    case 'blast':updBlast(dt);break;
    case 'shelter':updShelter(dt);break;
    case 'play2':updPlay2(dt);break;
    case 'win':updWin(dt);break;
    case 'dead':
      deadT+=dt;updParts(parts,dt);updParts(sparts,dt);
      if(deadT>.9&&(inp.confirm||inp.r)){stage===1?startStage1():startStage2();}
      break;
  }
  inp.any=inp.confirm=inp.jump=inp.down=inp.r=false;
}

function stick(x,y,o){
  const s=o.s||1,f=o.face||1,ph=o.ph||0;
  pen(o.col||'#222',o.lw||2,o.a??.92);
  const cr=o.crouch,leg=(cr?13:24)*s,body=(cr?18:23)*s,hr=8*s;
  const lean=(o.run?5:0)*f*s+(cr?3*f*s:0);
  const hipX=x,hipY=y-leg-(cr?2:0),shX=x+lean,shY=hipY-body;
  const hx=shX+(o.run?2*f*s:0),hy=shY-hr-2*s,mv=o.move?1:0;
  if(o.air){line(hipX,hipY,hipX-7*f*s,y-2*s);line(hipX,hipY,hipX+9*f*s,y-12*s);line(hipX+9*f*s,y-12*s,hipX+5*f*s,y-1*s,1);}

  else{const sw=Math.sin(ph)*(o.run?13:7)*s*mv;line(hipX,hipY,x+sw,y);line(hipX,hipY,x-sw,y);}
  line(hipX,hipY,shX,shY);
  circ(hx,hy,hr,2);
  if(o.cover){line(shX,shY+3*s,hx+7*f*s,hy-hr*.6);line(shX,shY+3*s,hx-5*f*s,hy-hr);}
  else if(o.panic){const a=Math.sin(ph*1.3)*7*s;line(shX,shY+3*s,shX-11*s,shY-15*s+a);line(shX,shY+3*s,shX+11*s,shY-15*s-a);}
  else if(o.wave){line(shX,shY+3*s,shX+12*f*s,shY+18*s);const a=Math.sin(T*10)*6;line(shX,shY+3*s,shX-8*f*s+a,shY-18*s);}

  if(o.mouth)circ(hx+3*f*s,hy+3*s,2*s,1);
  return{shX,shY,hx,hy,hr};
}

  txt('ТЫ ВЫЖИЛ',W/2,by+55,68,'#2a6a2a',1,'Caveat');
  txt('Вертолёт уносит тебя прочь от разрушенного города.',W/2,by+108,21,'#222');
  txt('Время: '+m+':'+String(s).padStart(2,'0')+'     Ранений: '+dmgTaken+'     Доза: '+Math.floor(rad)+'%',W/2,by+150,21,'#333');
  if(winT>3.5&&Math.floor(T*2)%2===0)txt('Пробел / нажми — в главное меню',W/2,by+235,21,'#555');
}
function drawTitle(){
  camX=0;setScreen();drawSkyline();setWorld();drawGround();setScreen();
  for(const c of clouds){const x=((c.x+T*8)%1400+1400)%1400-200;pen('#888',1.3,.6);circ(x,c.y,18*c.s,1);circ(x+22*c.s,c.y-8*c.s,22*c.s,1);circ(x+46*c.s,c.y,17*c.s,1);}
  ctx.globalAlpha=.88;ctx.fillStyle='#f6f1e2';ctx.fillRect(W/2-340,46,680,192);pen('#333',1.6,.8);rect(W/2-340,46,680,192,1);
  txt('ТРЕВОГА',W/2,116,116,'#b0281e',1,'Caveat');
  pen('#b0281e',3,.85);line(W/2-190,172,W/2+190,166,2);
  txt('карандашная игра о том, как выжить, когда на город летит ракета',W/2,207,22,'#333');
  const r=stick(W/2-300,GROUND,{face:1,ph:T*5,move:true,col:'#111',lw:2.6});scarf(r.shX,r.shY,1);
  const cx=W/2,cy=300;ctx.globalAlpha=.88;ctx.fillStyle='#f6f1e2';ctx.fillRect(cx-280,cy-32,560,120);pen('#333',1.4,.7);rect(cx-280,cy-32,560,120,1);
  txt('← → / A D — бежать        ↑ / W / Пробел — прыжок',cx,cy-8,20,'#222');
  txt('↓ / S — присесть, войти в укрытие      M — звук      P — пауза',cx,cy+22,20,'#222');
  txt('На телефоне — кнопки на экране (держи горизонтально)',cx,cy+54,17,'#555');
  if(Math.floor(T*2)%2===0)txt('Нажми любую клавишу или коснись экрана',cx,GROUND+42,28,'#b0281e',1,'Caveat');
}
function render(){
  pi^=1;
  shx=shake?(R()-.5)*shake:0;shy=shake?(R()-.5)*shake:0;
  ctx.setTransform(1,0,0,1,0,0);ctx.globalAlpha=1;
  if(papers[pi])ctx.drawImage(papers[pi],0,0);
  if(state==='title')drawTitle();
  else if(state==='shelter')drawShelterScene();
  else drawWorld();
  setScreen();
  if(flash>0){ctx.globalAlpha=Math.min(1,flash);ctx.fillStyle='#fffdf5';ctx.fillRect(0,0,W,H);}
  if(state!=='title')drawMsgs();
  if(state==='dead')drawDead();
  if(state==='win')drawWin();
  if(paused){setScreen();ctx.globalAlpha=.35;ctx.fillStyle='#222';ctx.fillRect(0,0,W,H);txt('ПАУЗА',W/2,H/2-10,80,'#f6f1e2',1,'Caveat');txt('P / Esc / нажми — продолжить',W/2,H/2+50,22,'#f6f1e2');}
  setScreen();pen('#333',2,.8);rect(6,6,W-12,H-12,1);
  ctx.globalAlpha=1;
}

/* ---------- цикл: логика 60 Гц, кадры 12/сек ---------- */
bgB=makeSkyline();makeClouds();
let last=performance.now(),acc=0,racc=1;
function frame(now){
  let dt=(now-last)/1000;last=now;if(dt>.25)dt=.25;if(dt<0)dt=0;
  if(!paused){acc+=dt;while(acc>=1/60){update(1/60);acc-=1/60;}}
  else{inp.any=inp.confirm=inp.jump=inp.down=inp.r=false;}
  racc+=dt;if(racc>=1/12){racc%=1/12;render();}
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
